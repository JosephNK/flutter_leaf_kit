name: flutter_leaf_platform
description: Location, Map, and WebView platform services for Flutter Leaf Kit.
version: "4.2.1-dev"
publish_to: 'none'
homepage: https://github.com/JosephNK/flutter_leaf_kit
resolution: workspace

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter

  # Location
  geolocator: ^14.0.2

  # Map
  google_maps_flutter: ^2.14.0

  # WebView
  webview_flutter: ^4.13.1
  webview_flutter_android: ^4.10.11
  webview_flutter_wkwebview: ^3.23.5
  flutter_inappwebview: ^6.1.5
  pointer_interceptor: ^0.10.1+2

  # Manager
  permission_handler: ^12.0.1
  path_provider: ^2.1.5
  device_info_plus: ^12.3.0
  package_info_plus: ^9.0.0
  app_tracking_transparency: ^2.0.6+1
  app_badge_plus: ^1.2.6
  share_plus: ^12.0.1
  url_launcher: ^6.3.2
  android_id: ^0.5.1

  flutter_leaf_common:
    git:
      url: https://github.com/JosephNK/flutter_leaf_kit.git
      ref: "v4.2.1-dev"
      path: ./packages/leaf_common

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
