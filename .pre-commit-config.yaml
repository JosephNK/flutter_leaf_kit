repos:
  # 기본 정리 hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml

  # Dart format & Flutter analyze + test (local hooks)
  - repo: local
    hooks:
      - id: dart-format
        name: dart format
        entry: dart format --set-exit-if-changed
        language: system
        types: [file]
        files: \.dart$

      - id: flutter-analyze
        name: flutter analyze
        entry: bash -c 'for pkg in packages/*/; do [ -f "$pkg/pubspec.yaml" ] && flutter analyze "$pkg" || exit 1; done'
        language: system
        pass_filenames: false
        files: \.dart$

      - id: flutter-test
        name: flutter test
        entry: bash -c 'for pkg in packages/*/; do if [ -d "$pkg/test" ] && ls "$pkg/test"/*_test.dart >/dev/null 2>&1 || find "$pkg/test" -name "*_test.dart" -print -quit 2>/dev/null | grep -q .; then flutter test "$pkg" || exit 1; fi; done'
        language: system
        pass_filenames: false
        files: \.dart$

  # Conventional commit 검증
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.3.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: [feat, fix, refactor, docs, test, chore, perf, ci]
